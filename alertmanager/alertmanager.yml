global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by:
    - alertname
    - project
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    webhook_configs:
      - url: https://nva1gvmb4m.execute-api.eu-west-2.amazonaws.com/alerts
        send_resolved: true
        http_config:
          basic_auth:
            username: alertmanager
            password_file: /etc/alertmanager/secrets/webhook_password
