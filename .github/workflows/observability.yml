name: Observability CI/CD

on:
  workflow_dispatch:
    inputs:
      action:
        description: Choose action
        required: true
        type: choice
        options:
          - bootstrap-backend
          - plan
          - deploy
          - destroy

permissions:
  contents: read
  id-token: write

concurrency:
  group: observability-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "861019856428"
  PROJECT_NAME: devops-observability-project
  ENVIRONMENT: dev
  AWS_ROLE_ARN: arn:aws:iam::861019856428:role/devops-observability-github-actions-role

jobs:
  bootstrap-backend:
    if: ${{ inputs.action == 'bootstrap-backend' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: project2-bootstrap-backend
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Calculate backend bucket
        run: |
          BUCKET="${PROJECT_NAME}-tfstate-${ENVIRONMENT}-${AWS_ACCOUNT_ID}-${AWS_REGION}"
          echo "TF_STATE_BUCKET=$BUCKET" >> "$GITHUB_ENV"
          echo "Backend bucket: $BUCKET"

      - name: Create or verify backend bucket
        run: |
          set -euo pipefail

          if aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "Backend bucket already exists: $TF_STATE_BUCKET"
          else
            aws s3api create-bucket               --bucket "$TF_STATE_BUCKET"               --region "$AWS_REGION"               --create-bucket-configuration "LocationConstraint=$AWS_REGION"
          fi

          aws s3api put-public-access-block             --bucket "$TF_STATE_BUCKET"             --public-access-block-configuration             'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true'

          aws s3api put-bucket-versioning             --bucket "$TF_STATE_BUCKET"             --versioning-configuration Status=Enabled

          aws s3api put-bucket-encryption             --bucket "$TF_STATE_BUCKET"             --server-side-encryption-configuration             '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

          aws s3api put-bucket-ownership-controls             --bucket "$TF_STATE_BUCKET"             --ownership-controls 'Rules=[{ObjectOwnership=BucketOwnerEnforced}]'

      - name: Verify backend
        run: |
          aws s3api get-bucket-versioning --bucket "$TF_STATE_BUCKET"
          aws s3api get-bucket-encryption --bucket "$TF_STATE_BUCKET"
          aws s3api get-public-access-block --bucket "$TF_STATE_BUCKET"
          echo "Terraform backend ready: $TF_STATE_BUCKET"

  terraform:
    if: ${{ inputs.action == 'plan' || inputs.action == 'deploy' || inputs.action == 'destroy' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: project2-terraform
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Calculate backend bucket
        run: |
          BUCKET="${PROJECT_NAME}-tfstate-${ENVIRONMENT}-${AWS_ACCOUNT_ID}-${AWS_REGION}"
          echo "TF_STATE_BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false             -backend-config="bucket=$TF_STATE_BUCKET"             -backend-config="key=dev/terraform.tfstate"             -backend-config="region=$AWS_REGION"             -backend-config="encrypt=true"             -backend-config="use_lockfile=true"

      - name: Terraform validate
        working-directory: terraform/environments/dev
        run: terraform validate

      - name: Terraform plan
        if: ${{ inputs.action == 'plan' }}
        working-directory: terraform/environments/dev
        run: terraform plan -input=false

      - name: Terraform deploy plan
        if: ${{ inputs.action == 'deploy' }}
        working-directory: terraform/environments/dev
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: ${{ inputs.action == 'deploy' }}
        working-directory: terraform/environments/dev
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform outputs
        if: ${{ inputs.action == 'deploy' }}
        working-directory: terraform/environments/dev
        run: terraform output

      - name: Terraform destroy plan
        if: ${{ inputs.action == 'destroy' }}
        working-directory: terraform/environments/dev
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      - name: Terraform destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: terraform/environments/dev
        run: terraform apply -input=false -auto-approve destroy.tfplan
