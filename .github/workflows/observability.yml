name: Observability CI/CD

on:
  workflow_dispatch:
    inputs:
      action:
        description: Choose action
        required: true
        type: choice
        options:
          - bootstrap-backend
          - plan
          - deploy
          - destroy

permissions:
  contents: read
  id-token: write

concurrency:
  group: observability-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "861019856428"
  PROJECT_NAME: devops-observability-project
  ENVIRONMENT: dev
  AWS_ROLE_ARN: arn:aws:iam::861019856428:role/devops-observability-github-actions-role
  TF_VAR_alert_email: ${{ secrets.TF_VAR_alert_email }}

jobs:
  bootstrap-backend:
    if: ${{ inputs.action == 'bootstrap-backend' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: project2-bootstrap-backend
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Calculate backend bucket
        run: |
          BUCKET="${PROJECT_NAME}-tfstate-${ENVIRONMENT}-${AWS_ACCOUNT_ID}-${AWS_REGION}"
          echo "TF_STATE_BUCKET=$BUCKET" >> "$GITHUB_ENV"
          echo "Backend bucket: $BUCKET"

      - name: Create or verify backend bucket
        run: |
          set -euo pipefail

          if aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "Backend bucket already exists: $TF_STATE_BUCKET"
          else
            aws s3api create-bucket               --bucket "$TF_STATE_BUCKET"               --region "$AWS_REGION"               --create-bucket-configuration "LocationConstraint=$AWS_REGION"
          fi

          aws s3api put-public-access-block             --bucket "$TF_STATE_BUCKET"             --public-access-block-configuration             'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true'

          aws s3api put-bucket-versioning             --bucket "$TF_STATE_BUCKET"             --versioning-configuration Status=Enabled

          aws s3api put-bucket-encryption             --bucket "$TF_STATE_BUCKET"             --server-side-encryption-configuration             '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

          aws s3api put-bucket-ownership-controls             --bucket "$TF_STATE_BUCKET"             --ownership-controls 'Rules=[{ObjectOwnership=BucketOwnerEnforced}]'

      - name: Verify backend
        run: |
          aws s3api get-bucket-versioning --bucket "$TF_STATE_BUCKET"
          aws s3api get-bucket-encryption --bucket "$TF_STATE_BUCKET"
          aws s3api get-public-access-block --bucket "$TF_STATE_BUCKET"
          echo "Terraform backend ready: $TF_STATE_BUCKET"

  terraform:
    if: ${{ inputs.action == 'plan' || inputs.action == 'deploy' || inputs.action == 'destroy' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: project2-terraform
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Calculate backend bucket
        run: |
          BUCKET="${PROJECT_NAME}-tfstate-${ENVIRONMENT}-${AWS_ACCOUNT_ID}-${AWS_REGION}"
          echo "TF_STATE_BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false             -backend-config="bucket=$TF_STATE_BUCKET"             -backend-config="key=dev/terraform.tfstate"             -backend-config="region=$AWS_REGION"             -backend-config="encrypt=true"             -backend-config="use_lockfile=true"

      - name: Terraform validate
        working-directory: terraform/environments/dev
        run: terraform validate

      - name: Terraform plan
        if: ${{ inputs.action == 'plan' }}
        working-directory: terraform/environments/dev
        run: terraform plan -input=false

      - name: Terraform deploy plan
        if: ${{ inputs.action == 'deploy' }}
        working-directory: terraform/environments/dev
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: ${{ inputs.action == 'deploy' }}
        working-directory: terraform/environments/dev
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform outputs
        if: ${{ inputs.action == 'deploy' }}
        working-directory: terraform/environments/dev
        run: terraform output

      - name: Wait for monitoring EC2 bootstrap
        if: ${{ inputs.action == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID=$(terraform -chdir=terraform/environments/dev output -raw monitoring_instance_id)

          echo "Waiting for EC2 cloud-init and Docker readiness..."

          python3 - <<'PY'
          import json
          from pathlib import Path

          Path("ssm-readiness.json").write_text(json.dumps({
              "commands": [
                  "set -eu",
                  "cloud-init status --wait",
                  "systemctl is-active --quiet docker",
                  "docker info >/dev/null",
                  "docker ps --format '{{.Names}}'"
              ]
          }))
          PY

          READY=false

          for ATTEMPT in $(seq 1 30); do
            COMMAND_ID=$(aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters file://ssm-readiness.json \
              --query 'Command.CommandId' \
              --output text 2>/dev/null) || {
                echo "Attempt $ATTEMPT: SSM not ready yet."
                sleep 10
                continue
              }

            if aws ssm wait command-executed \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" 2>/dev/null; then
              echo "EC2 bootstrap completed. Docker is ready."
              READY=true
              break
            fi

            echo "Attempt $ATTEMPT: waiting for bootstrap..."
            sleep 10
          done

          rm -f ssm-readiness.json

          if [ "$READY" != "true" ]; then
            echo "ERROR: EC2 bootstrap did not become ready."
            exit 1
          fi

      - name: Deploy Alertmanager through SSM
        if: ${{ inputs.action == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID=$(terraform -chdir=terraform/environments/dev output -raw monitoring_instance_id)

          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          import subprocess

          webhook_url = subprocess.check_output(
              [
                  "terraform",
                  "-chdir=terraform/environments/dev",
                  "output",
                  "-raw",
                  "alert_webhook_url",
              ],
              text=True,
          ).strip()

          config_text = Path("alertmanager/alertmanager.yml").read_text()

          import re

          config_text, count = re.subn(
              r"https://[a-z0-9]+\.execute-api\.eu-west-2\.amazonaws\.com/alerts",
              webhook_url,
              config_text,
          )

          if count != 1:
              raise RuntimeError(f"Expected one webhook URL, found {count}")

          config = base64.b64encode(config_text.encode()).decode()

          script = base64.b64encode(
              Path("scripts/deploy-alertmanager.sh").read_bytes()
          ).decode()

          commands = [
              "set -eu",
              "mkdir -p /opt/observability/alertmanager",
              f"echo '{config}' | base64 -d > /opt/observability/alertmanager/alertmanager.yml.new",
              f"echo '{script}' | base64 -d > /tmp/deploy-alertmanager.sh",
              "chmod 700 /tmp/deploy-alertmanager.sh",
              "trap 'rm -f /tmp/deploy-alertmanager.sh' EXIT",
              "bash /tmp/deploy-alertmanager.sh",
          ]

          Path("ssm-parameters.json").write_text(
              json.dumps({"commands": commands})
          )
          PY

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Project 2 Alertmanager configuration" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          rm -f ssm-parameters.json

          echo "Waiting for SSM deployment: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            echo "SSM command did not complete successfully."
          fi

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query Status \
            --output text)

          test "$STATUS" = "Success"

      - name: Terraform destroy plan
        if: ${{ inputs.action == 'destroy' }}
        working-directory: terraform/environments/dev
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      - name: Terraform destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: terraform/environments/dev
        run: terraform apply -input=false -auto-approve destroy.tfplan
